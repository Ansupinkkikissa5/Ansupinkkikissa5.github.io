    <main>
        <header>
    <h1>Tee tilaus</h1>
        <form onsubmit="lahetatilaus(); return false;">
        <label>Teidän sähköposti:</label>
        <input type="text" id="sahkoposti" size="20">  

    <label> Tilaus </label>
          <textarea id="tilaus"
        placeholder="Kirjoittakaa tilauksenne ja mahdolliset muutos toiveet tänne:"></textarea><br>
        <input type="submit" value="Lähetä tilaus" style="margin-bottom: 80px;">
    </form>

<script>
function lahetatilaus() {
    const email = document.getElementById("sahkoposti").value;
    const tilaus = document.getElementById("tilaus").value;

    if (email === "" || tilaus === "") {
        alert("Täytä sekä sähköposti että tilaus!");
        return;
    }

    if (confirm("Tilaus on lähetetty!")) {
        console.log("tilaus käsitelty");
    }
}
</script>
